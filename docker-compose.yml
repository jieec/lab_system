# 高校实验室预约与设备运维系统 —— 一键部署
# 用法：docker compose up -d --build
# 访问：前端 http://localhost:8081 ，接口文档 http://localhost:8080/doc.html
# 注意：MySQL 初始化脚本只在数据卷为空时执行；换演示数据请先 `docker compose down -v`
# 显式指定项目名：项目目录含中文，Compose 默认从目录名推导会报
# "project name must not be empty"（中文字符不是合法的 Compose 项目名）
name: lab-system

services:
  mysql:
    image: mysql:8.0.40
    container_name: lab-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-lab123456}
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3307，避免与本机已安装的 MySQL 3306 冲突
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - lab-mysql-data:/var/lib/mysql
      # 必须按 01 / 02 顺序挂载：schema.sql 建表，data.sql 灌演示数据
      - ./lab-backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./lab-backend/src/main/resources/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  backend:
    build:
      context: ./lab-backend
    container_name: lab-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab123456}
      JWT_SECRET: ${JWT_SECRET:-lab-reservation-system-secret-key-2026-please-change}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./lab-frontend
    container_name: lab-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  lab-mysql-data:
